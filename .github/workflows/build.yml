name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # Required for cancelling workflow

jobs:
  # ======================================================================================
  #  Parallel Check Jobs (All run at the same time)
  # ======================================================================================

  # Job 1: Static Analysis (Lint, Dep-check, Duplicates)
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Advanced Tooling Cache
      - name: Cache dependencies & tools
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache
          key: tooling-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            tooling-${{ runner.os }}-

      - run: npm ci --prefer-offline

      - name: Lint Strict
        run: npm run lint:strict

      - name: Lint Architecture
        run: npm run lint:arch

      - name: Check Duplicates
        run: npm run scan:dup

      # Fail-Fast: Cancel entire workflow if this job fails
      - name: Cancel Workflow on Failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        shell: bash

  # Job 2: Type Check (Isolated CPU task)
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache dependencies & tools
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache
          key: tooling-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            tooling-${{ runner.os }}-

      - run: npm ci --prefer-offline
      - run: npm run type-check

      # Fail-Fast
      - name: Cancel Workflow on Failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        shell: bash

  # Job 3: Unit Test
  unit-test:
    name: Unit Test (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    env:
      TZ: Asia/Taipei
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache dependencies & tools
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache
          key: tooling-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            tooling-${{ runner.os }}-

      - run: npm ci --prefer-offline
      - run: npm run test:unit -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      # Fail-Fast
      - name: Cancel Workflow on Failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        shell: bash

  # Job 4: E2E Test
  e2e-test:
    name: E2E Test (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --prefer-offline

      - name: Get Playwright Version
        id: playwright-version
        shell: bash
        run: echo "PLAYWRIGHT_VERSION=$(npm list @playwright/test --depth=0 | grep @playwright/test | awk '{print $2}')" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Fail-Fast
      - name: Cancel Workflow on Failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        shell: bash

  # Job 5: Build (Runs concurrent with tests)
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei
      VITE_SITE_URL: https://agubear.black
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for version info if needed

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache dependencies & tools
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache
          key: tooling-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            tooling-${{ runner.os }}-

      # FIX: Removed global NODE_ENV: production so npm ci installs devDeps (like husky)
      - run: npm ci --prefer-offline

      # Use build:ci to skip type-check
      # FIX: Apply NODE_ENV: production ONLY here
      - name: Build
        run: npm run build:ci
        env:
          NODE_ENV: production

      - name: Generate Deploy Config
        run: node scripts/generate-deploy-config.mjs

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      # Fail-Fast
      - name: Cancel Workflow on Failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        shell: bash

  # ======================================================================================
  #  Deploy Job (Runs only if ALL above pass)
  # ======================================================================================
  deploy:
    name: Deploy to GitHub Pages
    needs: [static-analysis, type-check, unit-test, e2e-test, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ==================================================================  ====================
  #  Purge CDN Job (Runs after Deployment)
  # ======================================================================================
  purge-cdn:
    name: Purge Cloudflare Cache
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Debug Check
        run: |
          echo "Zone ID 長度: ${#ZONE_ID}"
          echo "Token 長度: ${#TOKEN}"
        env:
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Purge Cache
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
          -H "Authorization: Bearer $CF_API_TOKEN" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'