name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # 允許手動觸發執行

# 併發控制：同一 branch 只保留最新一次，避免浪費資源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write      # 👈 授權部屬 Pages
  id-token: write   # 👈 授權 OIDC token

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei

    steps:
      # 1. Checkout（shallow clone 加速）
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Node.js + npm 快取
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. 安裝依賴（npm ci 比 npm install 更快且確定性）
      - name: Install dependencies
        run: npm ci --prefer-offline

      # 4. 執行整合檢查
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SITE_URL: https://agubear.black

      # 5. 上傳 Pages 產物 (官方推薦)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # 官方：執行部署
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
