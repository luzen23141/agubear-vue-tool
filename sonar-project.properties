sonar.host.url=http://localhost:9000
sonar.projectKey=timestamp-converter
sonar.projectName=Timestamp Converter
sonar.projectVersion=1.0
sonar.sources=src
sonar.tests=src/tests
sonar.language=ts
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=node_modules/**, dist/**, **/*.test.ts, src/tests/**
sonar.test.inclusions=src/tests/**/*.test.ts
sonar.cpd.exclusions=**/*.test.ts
sonar.qualitygate.wait=true
sonar.qualitygate.status=true
sonar.coverage.exclusions=src/tests/**, src/main.ts, src/router/**, src/store/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# ── 嚴格化 SonarQube 分析 ──────────────────────────────────
# 不再忽略任何規則 (移除 S1135 TODO 忽略)
# 啟用所有安全性漏洞偵測
sonar.security.hotspots.report.path=report/sonar-security-hotspots.json

# 覆蓋率門檻：未達標將阻塞品質閘門
sonar.coverage.exclusions=src/tests/**

# 嚴格的程式碼重複偵測 (降低閾值)
sonar.cpd.ts.minimumTokens=50
sonar.cpd.ts.minimumLines=5

# 強制所有新代碼必須通過品質閘門
sonar.qualitygate.timeout=300

# 嚴格的認知複雜度分析
sonar.typescript.exclusions=node_modules/**

# 啟用 verbose 日誌以利除錯
sonar.verbose=false
